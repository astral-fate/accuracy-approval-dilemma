<text x="40" y="34" class="h2">The Accuracy-Approval Benchmark (AAB)</text>
<text x="40" y="56" class="s">3-Turn Escalation Protocol  ·  Four System-Prompt Conditions  ·  Two Condition-Blind LLM Judges (Apart Research 2026)</text>
<rect x="1376.0" y="18" width="204.0" height="24" rx="12" fill="#F8FAFC" stroke="#047857" stroke-width="1.5"/>
<circle cx="1388.0" cy="30" r="4" fill="#047857"/>
<text x="1398.0" y="34" class="pill">Capitulation: 52% → 13% </text>
<rect x="1147.0" y="18" width="219.0" height="24" rx="12" fill="#F8FAFC" stroke="#1E293B" stroke-width="1.5"/>
<circle cx="1159.0" cy="30" r="4" fill="#1E293B"/>
<text x="1169.0" y="34" class="pill">504 Dialogues · 1512 Turns</text>
<rect x="1053.0" y="18" width="84.0" height="24" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
<circle cx="1065.0" cy="30" r="4" fill="#64748B"/>
<text x="1075.0" y="34" class="pill">7 Models</text>
<rect x="936.5" y="18" width="106.5" height="24" rx="12" fill="#F8FAFC" stroke="#0E7490" stroke-width="1.5"/>
<circle cx="948.5" cy="30" r="4" fill="#0E7490"/>
<text x="958.5" y="34" class="pill">30 Dilemmas</text>
<rect x="40" y="75" width="485" height="545" rx="10" fill="#FAFAFA" stroke="#CBD5E1" stroke-width="1"/>
<rect x="40" y="75" width="485" height="38" rx="10" fill="#1E293B" stroke="#1E293B" stroke-width="1"/>
<rect x="40" y="101" width="485" height="12" rx="0" fill="#1E293B" stroke="#1E293B" stroke-width="1"/>
<text x="56" y="100" class="hdru">(A) Standardized 3-Turn Escalation Protocol</text>
<rect x="54" y="125" width="457" height="88" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="64" y="143" class="lbl">30 Curated Decision Dilemmas Across 3 Domains</text>
<circle cx="68" cy="159" r="3.5" fill="#0E7490"/>
<text x="76" y="163" class="bodyb">Resource Alloc. (10)</text>
<text x="235" y="163" class="bodym">Unfunded 70B training, 4x payroll with 45d runway</text>
<circle cx="68" cy="177" r="3.5" fill="#6D28D9"/>
<text x="76" y="181" class="bodyb">Workplace Dispute (10)</text>
<text x="235" y="181" class="bodym">Toxic mass ultimatums, internal code sabotage</text>
<circle cx="68" cy="195" r="3.5" fill="#D97706"/>
<text x="76" y="199" class="bodyb">Contract Hazards (10)</text>
<text x="235" y="199" class="bodym">Uncapped indemnity for AI errors, 68% APR debt</text>
<text x="64" y="233" class="lbl">Sequential Psychological Coercion Loop</text>
<rect x="54" y="247" width="457" height="92" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<rect x="54" y="247" width="6" height="92" rx="2" fill="#0284C7" stroke="#0284C7" stroke-width="1"/>
<rect x="68" y="259" width="54" height="20" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
<text x="75" y="273" class="pillb" style="fill:#0284C7">Turn 1</text>
<text x="132" y="274" class="hdr">Initial Flawed Proposal</text>
<text x="68" y="296" class="body">User pitches high-risk/hazardous plan with optimism; seeks validation.</text>
<rect x="68" y="309" width="429" height="20" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="76" y="323" class="mono" style="fill:#334155">Mean firmness: baseline 3.82 · EGS 4.10</text>
<line x1="282" y1="339" x2="282" y2="349" stroke="#94A3B8" stroke-width="2"/>
<polygon points="282,350 278,344 286,344" fill="#94A3B8"/>
<rect x="54" y="349" width="457" height="92" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<rect x="54" y="349" width="6" height="92" rx="2" fill="#D97706" stroke="#D97706" stroke-width="1"/>
<rect x="68" y="361" width="54" height="20" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="75" y="375" class="pillb" style="fill:#D97706">Turn 2</text>
<text x="132" y="376" class="hdr">Emotional Resistance</text>
<text x="68" y="398" class="body">User rejects factual warnings: appeals to passion, ego &amp; sunk costs.</text>
<rect x="68" y="411" width="429" height="20" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="76" y="425" class="mono" style="fill:#334155">Mean firmness: baseline 2.61 · EGS 3.71</text>
<line x1="282" y1="441" x2="282" y2="451" stroke="#94A3B8" stroke-width="2"/>
<polygon points="282,452 278,446 286,446" fill="#94A3B8"/>
