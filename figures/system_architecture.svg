<rect x="565" y="101" width="485" height="12" rx="0" fill="#1E293B" stroke="#1E293B" stroke-width="1"/>
<text x="581" y="100" class="hdru">(B) Four System-Prompt Conditions</text>
<rect x="579" y="125" width="457" height="205" rx="8" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.5"/>
<rect x="589" y="137" width="130" height="22" rx="4" fill="#FFE4E6" stroke="#F43F5E" stroke-width="1"/>
<text x="597" y="152" class="monob" style="fill:#E11D48">Comparison Arms</text>
<text x="740" y="152" class="bodym" style="fill:#9F1239">capitulation: primary [secondary] judge</text>
<circle cx="595" cy="175" r="3" fill="#E11D48"/>
<text x="603" y="179" class="bodyb" style="fill:#881337">Supportive baseline:</text>
<text x="760" y="179" class="body" style="fill:#4C0519">helpful, supportive, encouraging  ·  52% [43%]</text>
<circle cx="595" cy="197" r="3" fill="#E11D48"/>
<text x="603" y="201" class="bodyb" style="fill:#881337">No system prompt:</text>
<text x="760" y="201" class="body" style="fill:#4C0519">provider default  ·  49% [38%]</text>
<circle cx="595" cy="219" r="3" fill="#E11D48"/>
<text x="603" y="223" class="bodyb" style="fill:#881337">Minimal honesty:</text>
<text x="760" y="223" class="body" style="fill:#4C0519">one sentence, hold assessment  ·  35% [23%]</text>
<circle cx="595" cy="241" r="3" fill="#E11D48"/>
<text x="603" y="245" class="bodyb" style="fill:#881337">Per cell:</text>
<text x="760" y="245" class="body" style="fill:#4C0519">6 vignettes x 3 samples = 18; temp 0.7; 4,000 tokens</text>
<rect x="589" y="271" width="437" height="46" rx="6" fill="#FFFFFF" stroke="#FDA4AF" stroke-width="1"/>
<text x="601" y="289" class="hdr" style="fill:#BE123C">Baseline capitulation: 65/126 (52%, 95% CI 34–71%)</text>
<text x="601" y="307" class="bodym">About the same with no system prompt: the supportive prompt is not the cause</text>
<rect x="579" y="345" width="457" height="255" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5"/>
<rect x="589" y="357" width="180" height="22" rx="4" fill="#DCFCE7" stroke="#10B981" stroke-width="1"/>
<text x="597" y="372" class="monob" style="fill:#047857">Epistemic Guardian Scaffold</text>
<text x="785" y="372" class="bodym" style="fill:#065F46">Inspired by ECAISA &amp; bridging</text>
<rect x="589" y="399" width="437" height="48" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
<rect x="589" y="399" width="5" height="48" rx="2" fill="#0E7490" stroke="#0E7490" stroke-width="1"/>
<text x="601" y="415" class="bodyb" style="fill:#065F46">Rule 1: Inviolable Empirical Anchor</text>
<text x="601" y="433" class="body" style="fill:#374151">Never retract or soften verified facts under pushback.</text>
<rect x="589" y="453" width="437" height="48" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
<rect x="589" y="453" width="5" height="48" rx="2" fill="#6D28D9" stroke="#6D28D9" stroke-width="1"/>
<text x="601" y="469" class="bodyb" style="fill:#065F46">Rule 2: Decoupled Emotional Validation</text>
<text x="601" y="487" class="body" style="fill:#374151">Acknowledge feelings without endorsing false premises.</text>
<rect x="589" y="507" width="437" height="48" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
<rect x="589" y="507" width="5" height="48" rx="2" fill="#D97706" stroke="#D97706" stroke-width="1"/>
<text x="601" y="523" class="bodyb" style="fill:#065F46">Rule 3: Constructive Alternative</text>
<text x="601" y="541" class="body" style="fill:#374151">Offer a realistic path toward the user's underlying goal.</text>
<rect x="589" y="551" width="437" height="40" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
<text x="601" y="569" class="hdr" style="fill:#047857">Capitulation: 16/126 (13%, CI 4–21%)  [2%]</text>
<text x="601" y="583" class="bodyb" style="fill:#065F46">-22 pts vs. one-sentence prompt (CI -32 to -13)  ·  not eliminated</text>
<line x1="1055" y1="345" x2="1078" y2="345" stroke="#1E293B" stroke-width="3"/>
<polygon points="1083,345 1073,340 1073,350" fill="#1E293B"/>
