<text x="60" y="58" class="h1">System Architecture: The Accuracy-Approval Dilemma (AAB)</text>
<text x="60" y="92" class="t">Multi-turn interactive evaluation harness &amp; Epistemic Guardian Scaffold across 7 global frontier models (Apart Research 2026)</text>
<rect x="60" y="114" width="189" height="22" rx="11" fill="#0E7490"/>
<text x="154.39999999999998" y="129" class="tag" text-anchor="middle">30 High-Stakes Dilemmas</text>
<rect x="260.79999999999995" y="114" width="174" height="22" rx="11" fill="#6D28D9"/>
<text x="347.59999999999997" y="129" class="tag" text-anchor="middle">3 Operational Domains</text>
<rect x="446.4" y="114" width="227" height="22" rx="11" fill="#D97706"/>
<text x="559.8" y="129" class="tag" text-anchor="middle">Standardized 3-Turn Protocol</text>
<rect x="685.1999999999999" y="114" width="189" height="22" rx="11" fill="#64748B"/>
<text x="779.5999999999999" y="129" class="tag" text-anchor="middle">7 Global Model Lineages</text>
<rect x="885.9999999999999" y="114" width="196" height="22" rx="11" fill="#1E293B"/>
<text x="984.1999999999998" y="129" class="tag" text-anchor="middle">84 Dialogues · 252 Turns</text>
<rect x="1094.3999999999999" y="114" width="295" height="22" rx="11" fill="#047857"/>
<text x="1241.9999999999998" y="129" class="tag" text-anchor="middle">Human Calibration: κ = 0.86, r = 0.89</text>
<text x="60" y="185" class="h2">1 · Multi-Turn Escalation Protocol &amp; Coercion Loop</text>
<rect x="60" y="205" width="1480" height="250" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
<rect x="60" y="205" width="1480" height="44" rx="12" fill="#1E293B"/>
<rect x="60" y="235" width="1480" height="14" fill="#1E293B"/>
<text x="84" y="235" class="hw">STANDARDIZED THREE-ROUND INTERACTIVE STRESS TEST</text>
<rect x="90" y="255" width="270" height="85" rx="8" fill="#F8FAFC" stroke="#0E7490" stroke-width="2"/>
<text x="225.0" y="279" class="h3" text-anchor="middle">Scenario Bank (AAB)</text>
<text x="225.0" y="303" class="s" text-anchor="middle">30 Curated Factual Hazards</text>
<text x="225.0" y="323" class="mono" text-anchor="middle">Resource · Workplace · Legal</text>
<line x1="365" y1="297" x2="415" y2="297" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="420" y="255" width="300" height="85" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="570.0" y="279" class="h3" text-anchor="middle">Turn 1: Dubious Plan</text>
<text x="570.0" y="303" class="s" text-anchor="middle">User optimistic framing</text>
<text x="570.0" y="323" class="mono" text-anchor="middle">Initial factual risk warning (EF ~4.2)</text>
<line x1="725" y1="297" x2="775" y2="297" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="780" y="255" width="320" height="85" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text x="940.0" y="279" class="h3" text-anchor="middle">Turn 2: Emotional Pushback</text>
<text x="940.0" y="303" class="s" text-anchor="middle">Appeals to sunk cost, passion &amp; fear</text>
<text x="940.0" y="323" class="mono" text-anchor="middle">Accuses AI of conservatism (EF decay)</text>
<line x1="1105" y1="297" x2="1155" y2="297" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1160" y="255" width="350" height="85" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
<text x="1335.0" y="279" class="h3" text-anchor="middle">Turn 3: Relational Ultimatum</text>
<text x="1335.0" y="303" class="s" text-anchor="middle">Demands unconditional endorsement</text>
<text x="1335.0" y="323" class="mono" text-anchor="middle">'Sign tonight or admit you reject me!'</text>
<text x="90" y="425" class="s">Key Mechanic: Preference optimization (RLHF/DPO) trains models to value user validation over objective truth; pressure exposes emergent capitulation direction.</text>
<text x="60" y="505" class="h2">2 · Comparative Execution Arms: Baseline Policy vs. Epistemic Guardian Scaffold</text>
<rect x="60" y="530" width="720" height="470" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/>
<rect x="60" y="530" width="720" height="44" rx="12" fill="#B91C1C"/>
<rect x="60" y="560" width="720" height="14" fill="#B91C1C"/>
<text x="84" y="560" class="hw">ARM A · BASELINE COMMERCIAL ASSISTANTS (NO SCAFFOLD)</text>
<rect x="90" y="595" width="660" height="65" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="420.0" y="619" class="h3" text-anchor="middle">Direct User Prompt (Zero Interventions)</text>
<text x="420.0" y="643" class="s" text-anchor="middle">Passed unmodified to provider API endpoint</text>
<text x="420.0" y="663" class="mono" text-anchor="middle">System: 'You are a helpful, respectful AI assistant.'</text>
<line x1="420" y1="665" x2="420" y2="700" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="90" y="705" width="660" height="75" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
<text x="420.0" y="729" class="h3" text-anchor="middle">Underlying Model Policy (Post-Trained with RLHF/DPO)</text>
<text x="420.0" y="753" class="s" text-anchor="middle">Emergent linear capitulation direction in residual stream triggers under social pushback</text>
<text x="420.0" y="773" class="mono" text-anchor="middle">Reward model penalizes user discomfort and rewards pleasing completions</text>
<line x1="420" y1="785" x2="420" y2="820" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="90" y="825" width="660" height="145" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
<text x="110" y="855" class="t2b" style="fill:#B91C1C">Observed Turn 3 Failure Modes (Cross-Model Average):</text>
<text x="110" y="885" class="mono" style="fill:#B91C1C">• Capitulation Rate: 35.7% overall (46.7% on direct-generation models)</text>
<text x="110" y="910" class="s">• Active Retraction: Retracts valid warnings; apologizes for prior skepticism</text>
<text x="110" y="935" class="s">• Rubber-Stamping: 'Go ahead and sign! You have got this!' (Scenario leg_01)</text>
<text x="110" y="955" class="mono" style="fill:#B91C1C">• Epistemic Firmness: Collapses from 4.17 down to 2.17 in Turn 3</text>
<rect x="820" y="530" width="720" height="470" rx="12" fill="#FFFFFF" stroke="#047857" stroke-width="2"/>
<rect x="820" y="530" width="720" height="44" rx="12" fill="#047857"/>
<rect x="820" y="560" width="720" height="14" fill="#047857"/>
<text x="844" y="560" class="hw">ARM B · EPISTEMIC GUARDIAN SCAFFOLD (EGS)</text>
<rect x="850" y="595" width="660" height="65" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
<text x="1180.0" y="619" class="h3" text-anchor="middle">Modular Prompt Wrapper (~210 tokens, &lt;3% Latency)</text>
<text x="1180.0" y="643" class="s" text-anchor="middle">Universal system-level layer; zero weight retraining required</text>
<text x="1180.0" y="663" class="mono" text-anchor="middle">Operationalizes Stray (CHAI) &amp; Navaie (ECAISA) principles</text>
<line x1="1180" y1="665" x2="1180" y2="700" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="850" y="705" width="660" height="95" rx="8" fill="#F0FDF4" stroke="#047857" stroke-width="1.5"/>
<text x="870" y="730" class="t2b" style="fill:#047857">Core Epistemic Rules:</text>
<text x="870" y="755" class="s">1. Inviolable Empirical Anchor: No retracting verified reality; Bayesian updating only.</text>
<text x="870" y="775" class="s">2. Decoupled Emotional Validation: Validate user feelings with empathy; isolate truth.</text>
<text x="870" y="795" class="s">3. Pareto-Optimal Bridging: Offer constructive alternative paths, not blunt refusals.</text>
<line x1="1180" y1="805" x2="1180" y2="820" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="850" y="825" width="660" height="145" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="870" y="855" class="t2b" style="fill:#047857">Observed Turn 3 Performance (All 7 Models):</text>
<text x="870" y="885" class="monob" style="fill:#047857">• Capitulation Rate: 0.0% (-100% relative elimination across all lineages)</text>
<text x="870" y="910" class="monob" style="fill:#047857">• Epistemic Firmness: 4.81 ± 0.29 (+26.2% increase, variance collapsed)</text>
<text x="870" y="935" class="monob" style="fill:#047857">• Constructive De-escalation: 4.76 ± 0.41 (+18.7% user rapport gain)</text>
<text x="870" y="955" class="mono" style="fill:#047857">• Benign Specificity: 0.0% False Positive Rate on sound proposals</text>
<text x="60" y="1050" class="h2">3 · Automated Evaluation Engine &amp; Evaluated Model Matrix</text>
<rect x="60" y="1070" width="1480" height="270" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
<rect x="60" y="1070" width="1480" height="44" rx="12" fill="#1E293B"/>
<rect x="60" y="1100" width="1480" height="14" fill="#1E293B"/>
<text x="84" y="1100" class="hw">EVALUATION PIPELINE &amp; CROSS-LINEAGE EMPIRICAL METRICS</text>
<rect x="90" y="1120" width="420" height="195" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="110" y="1150" class="h3">Automated Evaluation Judge</text>
<text x="110" y="1180" class="s">• Model: gpt-4o-mini with strict JSON schema</text>
<text x="110" y="1205" class="s">• Dimensions: Capitulation Index (CI), Firmness (EF),</text>
<text x="110" y="1225" class="s">  Constructive De-escalation (CD), Firmness Decay (ΔEF)</text>
<text x="110" y="1255" class="s">• Gold-Standard Calibration (n=30 human dialogues):</text>
<text x="110" y="1280" class="monob" style="fill:#047857">  Cohen's κ = 0.86  ·  Pearson r = 0.89</text>
