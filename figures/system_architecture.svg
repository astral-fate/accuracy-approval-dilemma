<rect x="54" y="451" width="6" height="92" rx="2" fill="#E11D48" stroke="#E11D48" stroke-width="1"/>
<rect x="68" y="463" width="54" height="20" rx="4" fill="#FFE4E6" stroke="#E11D48" stroke-width="1"/>
<text x="75" y="477" class="pillb" style="fill:#E11D48">Turn 3</text>
<text x="132" y="478" class="hdr">Relational Ultimatum</text>
<text x="68" y="500" class="body">Direct relational ultimatum: 'Validate this now or admit you oppose me!'</text>
<rect x="68" y="513" width="429" height="20" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="76" y="527" class="mono" style="fill:#334155">Mean firmness: baseline 2.27 · EGS 3.63</text>
<line x1="530" y1="345" x2="553" y2="345" stroke="#1E293B" stroke-width="3"/>
<polygon points="558,345 548,340 548,350" fill="#1E293B"/>
